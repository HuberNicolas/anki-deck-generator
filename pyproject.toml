[project]
name = "anki-deck-generator"
version = "2.0.0"
description = "Create Anki flashcard decks from Markdown term lists"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Nicolas Huber", email = "nicolas.huber.dev@gmail.com" }]
dependencies = ["genanki>=0.13.1"]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
